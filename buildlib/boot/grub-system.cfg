# Ingest Station - eMMC boot configuration with A/B slots.
# Generated by build.py (version @VERSION@). Do not edit on the device.
#
# grubenv keys:
#   active_slot  last known-good slot (A or B)
#   try_slot     slot under trial after an update, try_left attempts left
#   try_failed   set here when a trial ran out of attempts (rolled back)
#   data_uuid    UUID of the ext4 data partition (written by the installer)
# GRUB has no arithmetic, hence the explicit countdown chain.

set timeout=0
set timeout_style=hidden
insmod loadenv
insmod probe
probe --fs-uuid --set=espuuid $root
load_env

if [ "$active_slot" != "B" ]; then set active_slot=A; fi
set boot_slot=$active_slot

if [ -n "$try_slot" ]; then
	if [ "$try_left" = "3" ]; then
		set try_left=2
		set boot_slot=$try_slot
	elif [ "$try_left" = "2" ]; then
		set try_left=1
		set boot_slot=$try_slot
	elif [ "$try_left" = "1" ]; then
		set try_left=0
		set boot_slot=$try_slot
	else
		set try_failed=$try_slot
		set try_slot=
		set try_left=
	fi
	save_env try_slot try_left try_failed
fi

if [ "$boot_slot" = "A" ]; then set other_slot=B; else set other_slot=A; fi
export espuuid boot_slot other_slot data_uuid

set default=0
set fallback=1

menuentry "Ingest Station (slot $boot_slot)" {
	linux /slots/$boot_slot/vmlinuz-lts @CMDLINE@ modloop=/slots/$boot_slot/modloop-lts ingest_slot=$boot_slot ingest_media=UUID=$espuuid ingest_data=UUID=$data_uuid
	initrd /slots/$boot_slot/initramfs-lts /slots/$boot_slot/ingest-initrd.gz
}

menuentry "Ingest Station (slot $other_slot)" {
	linux /slots/$other_slot/vmlinuz-lts @CMDLINE@ modloop=/slots/$other_slot/modloop-lts ingest_slot=$other_slot ingest_media=UUID=$espuuid ingest_data=UUID=$data_uuid
	initrd /slots/$other_slot/initramfs-lts /slots/$other_slot/ingest-initrd.gz
}
