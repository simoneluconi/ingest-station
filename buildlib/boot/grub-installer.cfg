# Ingest Station - USB installer boot configuration.
# Generated by build.py (version @VERSION@).

set timeout=3
insmod probe
probe --fs-uuid --set=espuuid $root
export espuuid

menuentry "Install Ingest Station @VERSION@ to eMMC" {
	linux /slots/A/vmlinuz-lts @CMDLINE@ modloop=/slots/A/modloop-lts ingest_slot=A ingest_media=UUID=$espuuid ingest_mode=install @INSTALLER_EXTRA@
	initrd /slots/A/initramfs-lts /slots/A/ingest-initrd.gz
}

menuentry "Rescue shell (from USB, writes nothing)" {
	linux /slots/A/vmlinuz-lts @CMDLINE@ modloop=/slots/A/modloop-lts ingest_slot=A ingest_media=UUID=$espuuid ingest_mode=rescue
	initrd /slots/A/initramfs-lts /slots/A/ingest-initrd.gz
}
