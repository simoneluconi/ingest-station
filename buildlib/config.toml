# Build configuration for the Ingest Station image.

[alpine]
version = "3.24.2"
branch = "v3.24"
arch = "x86_64"
mirror = "https://dl-cdn.alpinelinux.org/alpine"
iso_flavor = "standard"
# Alpine release signing key (Natanael Copa); used to verify the ISO .asc
gpg_fingerprint = "0482D84022F52DF1C4E7CD43293ACD0907D9495A"
repos = ["main", "community"]

[kernel]
# modules loaded by the initramfs before the boot media scan (quirk: the eMMC
# host drivers are not auto-loaded on the Wyse 3040)
initramfs_modules = [
  "loop", "squashfs", "sd-mod", "usb-storage", "vfat", "nls_cp437",
  "nls_iso8859-1", "ext4", "sdhci", "sdhci-acpi", "mmc_block",
]
# extra modules copied from the modloop into ingest-initrd.gz
# watchdog drivers: the Wyse 3040 exposes its watchdog through the ACPI WDAT
# table (wdat_wdt); iTCO_wdt covers other Intel chipsets (and QEMU q35)
extra_initrd_modules = ["wdat_wdt", "iTCO_wdt", "lpc_ich"]
cmdline = [
  "quiet", "loglevel=3",
  "consoleblank=0",                                  # quirk: display does not wake up
  "modprobe.blacklist=dw_dmac_core,dw_dmac_pci",      # quirk: hang on reboot/poweroff
  "block.events_dfl_poll_msecs=1000",                # card readers without media events
  "fbcon=font:TER16x32",                             # readable console from 2 m
  "usbdelay=1",                                      # short media scan; early.sh waits for the ESP
  "modloop_verify=no",                               # slots are SHA-256 verified at install/update;
                                                     # the per-boot SHA1 check costs ~4 s
]
# only for the installed system: reboot instead of the initramfs recovery
# shell, so GRUB counts the attempt of a slot on trial
system_cmdline = ["panic=10"]
# heartbeat (seconds) of the hardware watchdog armed in the initramfs; 0 = off
watchdog_seconds = 300

[layout]
esp_size_mib = 1536
esp_label = "INGEST_ESP"
data_label = "ingest-data"
boot_tries = 3

[packages]
# installed at every boot from the slot's local repository (diskless mode)
system = [
  "alpine-base",
  "openssl",        # /init adds it for the modloop signature check
  "python3",
  "tzdata",
  "blkid", "lsblk", "wipefs", "sgdisk", "dosfstools", "e2fsprogs", "efibootmgr",
  "avahi",
  "openssh-server", # key-only root access for tests and --deploy updates
  # daemon
  "py3-xxhash",     # xxh128 hashes (C, fast)
  "nfs-utils",      # NFS destination
  "cifs-utils",     # SMB destination
  "libgphoto2",     # cameras and phones over PTP/MTP (ctypes, no FUSE)
  # GUI: pygame's runtime libraries (pygame itself is vendored, see below)
  "sdl2", "sdl2_image", "sdl2_mixer", "sdl2_ttf", "freetype", "libpng", "portmidi",
]

[vendor]
# Alpine packages whose files are extracted into /opt/ingest/vendor instead
# of being installed with apk, to skip a heavy dependency they only use
# optionally: pygame declares numpy (+ openblas, ~69 MiB in RAM) for
# surfarray, which the GUI does not use. The packages are verified like all
# the others and build.py checks that every other dependency is installed.
apk = ["py3-pygame", "py3-pygame-pyc"]
skip_deps = ["py3-numpy"]

[grub]
# modules loaded at runtime from $prefix/x86_64-efi (not embedded in the
# ISO's BOOTX64.EFI)
runtime_modules = ["loadenv", "probe"]
