# Test NFS server for Ingest Station (NFSv4 only, port 2049)
NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSv4 {
    Graceless = true;          # no 90 s grace period at start
    Minor_Versions = 0, 1, 2;
}

EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /ingest;          # the station mounts SERVER:/ingest
    Access_Type = RW;
    Squash = No_Root_Squash;   # like no_root_squash on a NAS
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    FSAL { Name = VFS; }
}

LOG {
    Default_Log_Level = EVENT;
}
