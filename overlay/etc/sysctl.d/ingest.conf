# keep the console quiet, errors only
kernel.printk = 3 4 1 3
# reboot on kernel panic and on oops (lets GRUB roll back a bad update)
kernel.panic = 10
kernel.panic_on_oops = 1
# keep little unwritten data in RAM: copy progress follows the real transfer
# and a power cut loses at most a few files in flight
vm.dirty_bytes = 67108864
vm.dirty_background_bytes = 16777216
