# Drivers the station never uses: not loaded by the hardware coldplug
# (hwdrivers), which saves boot time. Sound (the status beeps use the PC
# speaker input device, not ALSA), Intel ME, vendor WMI, power telemetry.
blacklist snd_hdmi_lpe_audio
blacklist snd_intel_sst_acpi
blacklist snd_soc_sst_atom_hifi2_platform
blacklist snd_sof_acpi
blacklist snd_sof_acpi_intel_byt
blacklist snd_sof_pci
blacklist snd_sof_pci_intel_tgl
blacklist snd_soc_rt5670
blacklist snd_hda_intel
blacklist snd_soc_skl
blacklist snd_soc_avs
blacklist mei_txe
blacklist mei_me
blacklist mei_hdcp
blacklist mei_pxp
blacklist dell_wmi
blacklist dell_smbios
blacklist dell_wmi_descriptor
blacklist dcdbas
blacklist wmi_bmof
blacklist intel_rapl_msr
blacklist intel_cstate
